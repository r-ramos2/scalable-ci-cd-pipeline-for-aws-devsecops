server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Do not expose nginx version in error pages or the Server response header
    server_tokens off;

    # React Router: fall back to index.html so client-side routes work
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressively cache immutable build assets (hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Baseline security headers
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;
    # CSP: 'unsafe-inline' is required for CRA-generated inline scripts/styles.
    # Tighten with nonces if you migrate to a build tool that supports them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self';" always;
}
