<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="awsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a2e45;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="vpcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a5c;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0f2a44;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="subnetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0e3d2f;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#0a2d22;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="jenkinsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d33833"/>
      <stop offset="100%" style="stop-color:#a02826"/>
    </linearGradient>
    <linearGradient id="cwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6b9a"/>
      <stop offset="100%" style="stop-color:#0f4d73"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="125%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4fc3f7"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#78909c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#66bb6a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#awsBg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="1">Scalable CI/CD Pipeline — AWS DevSecOps</text>
  <text x="450" y="58" text-anchor="middle" fill="#90caf9" font-size="11">Single VPC · Jenkins · Docker · SonarQube · Trivy · OWASP · React</text>
  <line x1="60" y1="68" x2="840" y2="68" stroke="#2c5282" stroke-width="1"/>

  <!-- AWS VPC Border -->
  <rect x="30" y="80" width="840" height="490" rx="10" fill="url(#vpcGrad)" stroke="#2d7dd2" stroke-width="1.5" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <text x="50" y="100" fill="#4fc3f7" font-size="11" font-weight="600">AWS VPC  10.0.0.0/16</text>

  <!-- Public Subnet -->
  <rect x="50" y="110" width="640" height="440" rx="8" fill="url(#subnetGrad)" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="6,3"/>
  <text x="70" y="130" fill="#66bb6a" font-size="10" font-weight="600">Public Subnet  10.0.1.0/24  ·  us-east-1a</text>

  <!-- Internet Gateway -->
  <rect x="700" y="195" width="140" height="60" rx="8" fill="#1a3a5c" stroke="#4fc3f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="220" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="700">🌐 Internet</text>
  <text x="770" y="238" text-anchor="middle" fill="#90caf9" font-size="10">Gateway</text>

  <!-- Security Group box -->
  <rect x="70" y="148" width="590" height="380" rx="6" fill="none" stroke="#e74c3c" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="90" y="164" fill="#e74c3c" font-size="9.5" font-weight="600">Security Group — ports: 22, 80, 443, 8080, 9000, 3000</text>

  <!-- Jenkins EC2 Instance -->
  <rect x="90" y="175" width="540" height="330" rx="10" fill="#1c2b3a" stroke="#d33833" stroke-width="2" filter="url(#shadow)"/>

  <!-- EC2 header -->
  <rect x="90" y="175" width="540" height="42" rx="10" fill="url(#jenkinsGrad)"/>
  <rect x="90" y="197" width="540" height="20" rx="0" fill="url(#jenkinsGrad)"/>
  <text x="360" y="196" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">⚙  EC2 Jenkins Server  (t3.large · 30 GB gp3 encrypted · IMDSv2)</text>
  <text x="360" y="211" text-anchor="middle" fill="#ffcdd2" font-size="9.5">Amazon Linux 2 · IAM Instance Profile · EBS Encrypted · SSH :22</text>

  <!-- Jenkins tool cards row 1 -->
  <!-- Jenkins -->
  <rect x="108" y="228" width="118" height="80" rx="7" fill="#2c1810" stroke="#d33833" stroke-width="1.5"/>
  <text x="167" y="252" text-anchor="middle" font-size="18">🏗</text>
  <text x="167" y="270" text-anchor="middle" fill="#ef9a9a" font-size="11" font-weight="700">Jenkins LTS</text>
  <text x="167" y="284" text-anchor="middle" fill="#78909c" font-size="9">CI/CD Orchestration</text>
  <text x="167" y="298" text-anchor="middle" fill="#ef9a9a" font-size="9">:8080</text>

  <!-- Docker -->
  <rect x="238" y="228" width="118" height="80" rx="7" fill="#0d1f2d" stroke="#2196f3" stroke-width="1.5"/>
  <text x="297" y="252" text-anchor="middle" font-size="18">🐳</text>
  <text x="297" y="270" text-anchor="middle" fill="#90caf9" font-size="11" font-weight="700">Docker</text>
  <text x="297" y="284" text-anchor="middle" fill="#78909c" font-size="9">Container Runtime</text>
  <text x="297" y="298" text-anchor="middle" fill="#90caf9" font-size="9">Image Build &amp; Push</text>

  <!-- SonarQube -->
  <rect x="368" y="228" width="118" height="80" rx="7" fill="#1a2a1a" stroke="#4caf50" stroke-width="1.5"/>
  <text x="427" y="252" text-anchor="middle" font-size="18">🔍</text>
  <text x="427" y="270" text-anchor="middle" fill="#a5d6a7" font-size="11" font-weight="700">SonarQube</text>
  <text x="427" y="284" text-anchor="middle" fill="#78909c" font-size="9">Static Code Analysis</text>
  <text x="427" y="298" text-anchor="middle" fill="#a5d6a7" font-size="9">:9000</text>

  <!-- React App -->
  <rect x="498" y="228" width="118" height="80" rx="7" fill="#1a1a2e" stroke="#7c4dff" stroke-width="1.5"/>
  <text x="557" y="252" text-anchor="middle" font-size="18">⚛</text>
  <text x="557" y="270" text-anchor="middle" fill="#b39ddb" font-size="11" font-weight="700">React App</text>
  <text x="557" y="284" text-anchor="middle" fill="#78909c" font-size="9">Frontend (Docker)</text>
  <text x="557" y="298" text-anchor="middle" fill="#b39ddb" font-size="9">:3000</text>

  <!-- Jenkins tool cards row 2 -->
  <!-- Trivy -->
  <rect x="108" y="323" width="118" height="80" rx="7" fill="#1a1a0a" stroke="#ff9800" stroke-width="1.5"/>
  <text x="167" y="347" text-anchor="middle" font-size="18">🛡</text>
  <text x="167" y="365" text-anchor="middle" fill="#ffcc80" font-size="11" font-weight="700">Trivy</text>
  <text x="167" y="379" text-anchor="middle" fill="#78909c" font-size="9">Container Scanning</text>
  <text x="167" y="393" text-anchor="middle" fill="#ffcc80" font-size="9">CVE Detection</text>

  <!-- OWASP -->
  <rect x="238" y="323" width="118" height="80" rx="7" fill="#2a0a0a" stroke="#f44336" stroke-width="1.5"/>
  <text x="297" y="347" text-anchor="middle" font-size="18">🔐</text>
  <text x="297" y="365" text-anchor="middle" fill="#ef9a9a" font-size="11" font-weight="700">OWASP</text>
  <text x="297" y="379" text-anchor="middle" fill="#78909c" font-size="9">Dependency-Check</text>
  <text x="297" y="393" text-anchor="middle" fill="#ef9a9a" font-size="9">SCA Scanning</text>

  <!-- Jenkinsfile pipeline -->
  <rect x="368" y="323" width="248" height="80" rx="7" fill="#0d1b2a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="492" y="345" text-anchor="middle" fill="#4fc3f7" font-size="10.5" font-weight="700">Jenkinsfile Pipeline Stages</text>
  <text x="492" y="362" text-anchor="middle" fill="#78909c" font-size="9">Checkout → OWASP → Trivy FS</text>
  <text x="492" y="375" text-anchor="middle" fill="#78909c" font-size="9">SonarQube → Docker Build</text>
  <text x="492" y="388" text-anchor="middle" fill="#78909c" font-size="9">Trivy Image → Deploy React</text>

  <!-- SSH note -->
  <rect x="108" y="417" width="508" height="30" rx="5" fill="#0a1628" stroke="#37474f" stroke-width="1"/>
  <text x="362" y="436" text-anchor="middle" fill="#78909c" font-size="9">SSH: ssh -i deployer_key.pem ec2-user@&lt;public_ip&gt; · Key via: terraform output -raw private_key_pem</text>

  <!-- CloudWatch / VPC Flow Logs panel -->
  <rect x="700" y="290" width="140" height="110" rx="8" fill="url(#cwGrad)" stroke="#4fc3f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="312" text-anchor="middle" fill="#e3f2fd" font-size="11" font-weight="700">☁ CloudWatch</text>
  <line x1="715" y1="318" x2="825" y2="318" stroke="#2196f3" stroke-width="0.8"/>
  <text x="770" y="333" text-anchor="middle" fill="#90caf9" font-size="9.5" font-weight="600">VPC Flow Logs</text>
  <text x="770" y="348" text-anchor="middle" fill="#78909c" font-size="8.5">/aws/vpc-flow-logs/</text>
  <text x="770" y="362" text-anchor="middle" fill="#78909c" font-size="8.5">retention: 14 days</text>
  <text x="770" y="376" text-anchor="middle" fill="#90caf9" font-size="9">ALL traffic logged</text>
  <text x="770" y="392" text-anchor="middle" fill="#78909c" font-size="8.5">IAM Role: flow-logs</text>

  <!-- IAM panel -->
  <rect x="700" y="420" width="140" height="90" rx="8" fill="#1a2a0a" stroke="#66bb6a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="442" text-anchor="middle" fill="#a5d6a7" font-size="11" font-weight="700">🔑 IAM</text>
  <line x1="715" y1="448" x2="825" y2="448" stroke="#4caf50" stroke-width="0.8"/>
  <text x="770" y="462" text-anchor="middle" fill="#90caf9" font-size="9">Instance Profile</text>
  <text x="770" y="476" text-anchor="middle" fill="#78909c" font-size="8.5">CloudWatch Logs</text>
  <text x="770" y="490" text-anchor="middle" fill="#78909c" font-size="8.5">SSM Session Manager</text>

  <!-- Developer box (outside VPC) -->
  <rect x="40" y="555" width="120" height="50" rx="8" fill="#1a2a3a" stroke="#4fc3f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="100" y="576" text-anchor="middle" fill="#4fc3f7" font-size="11" font-weight="700">👨‍💻 Developer</text>
  <text x="100" y="591" text-anchor="middle" fill="#78909c" font-size="9">git push → GitHub</text>

  <!-- GitHub box -->
  <rect x="200" y="555" width="120" height="50" rx="8" fill="#1a1a2e" stroke="#9c27b0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="260" y="576" text-anchor="middle" fill="#ce93d8" font-size="11" font-weight="700">🐙 GitHub</text>
  <text x="260" y="591" text-anchor="middle" fill="#78909c" font-size="9">Source Control</text>

  <!-- Arrows: Developer -> GitHub -->
  <line x1="160" y1="580" x2="196" y2="580" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: GitHub -> Jenkins -->
  <line x1="320" y1="580" x2="360" y2="490" stroke="#9c27b0" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="348" y="548" fill="#ce93d8" font-size="8.5" transform="rotate(-20,348,548)">Webhook</text>

  <!-- Arrow: VPC -> IGW -->
  <line x1="690" y1="225" x2="698" y2="225" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: VPC Flow Logs IAM role -->
  <line x1="640" y1="340" x2="697" y2="340" stroke="#4fc3f7" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrow: Jenkins IAM profile -->
  <line x1="640" y1="450" x2="697" y2="450" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowGreen)"/>

  <!-- Legend -->
  <rect x="380" y="555" width="480" height="50" rx="6" fill="#0a1220" stroke="#37474f" stroke-width="1"/>
  <text x="620" y="572" text-anchor="middle" fill="#78909c" font-size="9" font-weight="600">LEGEND</text>
  <rect x="395" y="578" width="12" height="3" fill="#e74c3c"/>
  <text x="412" y="585" fill="#90a4ae" font-size="8.5">Security Group</text>
  <rect x="470" y="578" width="12" height="3" fill="#27ae60" stroke-dasharray="4,2"/>
  <text x="487" y="585" fill="#90a4ae" font-size="8.5">Public Subnet</text>
  <rect x="545" y="578" width="12" height="3" fill="#2d7dd2" stroke-dasharray="8,4"/>
  <text x="562" y="585" fill="#90a4ae" font-size="8.5">VPC</text>
  <line x1="590" y1="582" x2="602" y2="582" stroke="#4fc3f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="608" y="585" fill="#90a4ae" font-size="8.5">Data / Traffic</text>
  <line x1="665" y1="582" x2="677" y2="582" stroke="#78909c" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowGray)"/>
  <text x="683" y="585" fill="#90a4ae" font-size="8.5">Trigger</text>
  <line x1="720" y1="582" x2="732" y2="582" stroke="#66bb6a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowGreen)"/>
  <text x="738" y="585" fill="#90a4ae" font-size="8.5">IAM</text>
  <text x="775" y="585" fill="#546e7a" font-size="8">Terraform-managed</text>

  <!-- Decorative corner badges -->
  <rect x="735" y="80" width="120" height="24" rx="12" fill="#1a3a5c" stroke="#2d7dd2" stroke-width="1"/>
  <text x="795" y="96" text-anchor="middle" fill="#90caf9" font-size="9" font-weight="600">🔒 IMDSv2 Enforced</text>
  <rect x="735" y="112" width="120" height="24" rx="12" fill="#1a2a0a" stroke="#27ae60" stroke-width="1"/>
  <text x="795" y="128" text-anchor="middle" fill="#a5d6a7" font-size="9" font-weight="600">📦 EBS Encrypted</text>
  <rect x="735" y="144" width="120" height="24" rx="12" fill="#2a0a1a" stroke="#e91e63" stroke-width="1"/>
  <text x="795" y="160" text-anchor="middle" fill="#f48fb1" font-size="9" font-weight="600">🌐 IP-Restricted SG</text>
</svg>
